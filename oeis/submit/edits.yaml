new_sequences:

- id:     "new:balanced"
  role:   balanced-lonely primes
  url:    "https://oeis.org/edit"
  notes: true
  summary: >-
    New sequence: the intersection of A023186 (lonely primes) with A006562
    (balanced primes) -- record-setting isolated primes exactly equidistant
    from both neighbors. 6 terms, complete below 2.6*10^16.
  to_editors: >-
    Suggested by Michel Marcus in review of a comment on A023186: submit the
    intersection as its own sequence rather than as a comment there. Not
    currently in OEIS. Every term is checked against an exhaustive scan from
    zero -- p - pp, np - p, equality of the two gaps, and each of pp, p, np
    prime by deterministic Miller-Rabin. The scan itself reproduces every
    published term of A023186 and A058867 below the bound, position by
    position, and confirms all terms here appear in A058867, as they must.
  entry:
    name: >-
      Balanced lonely primes: terms of A023186 that are also balanced primes
      (A006562), i.e. record-setting isolated primes exactly equidistant from
      their two nearest prime neighbors.
    offset: "1,1"
    data: [5, 53, 211, 26923643849953, 187891466722913, 4685407635944059]
    keywords: "nonn,more"
    author: "~~~~"
    comments:
    - >-
      A prime p qualifies if it sets a new record for the distance to its
      nearest neighboring prime (A023186) and is the average of the previous and
      following prime (A006562), so the gaps on both sides are equal.
    - >-
      A023186(1) = 2 is excluded: it has no lower neighbor, so it is not a
      balanced prime.
    - >-
      Not to be confused with A058867, which is a supersequence of this one.
      A058867 takes its record within the balanced primes alone, so a balanced
      prime enters it by beating every earlier balanced prime; a term here must
      beat every earlier prime, balanced or not. A058867(4) = 16787 shows the
      difference: its gaps are (24, 24), but A023186 had already reached 24 at
      the prime 16033, whose gaps are (26, 24), so 16787 sets no record over all
      primes. This sequence is the terms of A058867 that are in A023186.
    - >-
      There are no further terms below 2.6*10^16. An exhaustive scan from zero
      rederived every term of A023186 and of A058867 below that bound and found
      no others, so the sequence is complete there.
    example: |-
      5 has neighbors (3, 7), both at distance 2.
      53 has neighbors (47, 59), both at distance 6.
      211 has neighbors (199, 223), both at distance 12.
      26923643849953 has neighbors (26923643849563, 26923643850343), both at distance 390.
      187891466722913 has neighbors (187891466722493, 187891466723333), both at distance 420.
      4685407635944059 has neighbors (4685407635943549, 4685407635944569), both at distance 510.
    xrefs:
      A006562: balanced primes
      A023186: "lonely primes, of which this is a subsequence"
      A023187: the distances
      A054342: first balanced prime at each distance
      A058867: "supersequence; record within the balanced primes"
      A096265: aloof primes
  no_bfile: "6 terms fit in DATA"

